<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Royal VIP Gift - Ahmed Ghalab</title>

<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
</head>

<body>

<video autoplay muted loop id="bgVideo">
  <source src="https://cdn.pixabay.com/video/2023/04/18/160643-818493090_large.mp4">
</video>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b5f7.mp3">
</audio>

<audio id="openSound">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2f2c1f.mp3">
</audio>

<div class="overlay"></div>

<div class="container">

<!-- البداية -->
<div id="welcome" class="screen">
  <h1>⚜️ دعوة ملكية VIP ⚜️</h1>
  <p>بوكس خاص بـ أحمد غلاب 👑</p>
  <button onclick="openGate()">ادخل البوابة الملكية</button>
</div>

<!-- كلمة السر -->
<div id="gate" class="screen hidden">
  <h2>🔐 بوابة التاج الملكي</h2>
  <input type="password" id="pass" placeholder="كلمة السر">
  <button onclick="check()">فتح الهدية</button>
  <p id="error"></p>
</div>

<!-- العد -->
<div id="count" class="screen hidden">
  <h1 id="num">3</h1>
</div>

<!-- الهدية -->
<div id="gift" class="screen hidden">

  <div id="fireworks"></div>

  <div class="crown">👑</div>

  <h1 id="title"></h1>

  <img src="ahmed.jpg" class="profile">

  <div class="card glow">
    <p id="msg"></p>
  </div>

  <div class="card gold">
    <h2>👑 التتويج الملكي 👑</h2>
    <p>أنت ملك هذا اليوم يا أحمد غلاب 🎂</p>
  </div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
